[package]
name = "game-dock"
version = "0.1.0"
description = "Personal local game launcher"
authors = ["Game Dock"]
edition = "2021"

[lib]
name = "game_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
